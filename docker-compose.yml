services:
  # Database Tier (Isolated)
  db:
    image: postgres:16-alpine
    container_name: campus_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD:  ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus360"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Application Backend Tier
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: campus_backend
    restart: always
    environment:
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db_net
      - app_net

  # Frontend Web Tier & Reverse Proxy
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: campus_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app_net

volumes:
  pg_data:
    driver: local

networks:
  app_net:
    driver: bridge
  db_net:
    driver: bridge
